name: Rafael Virtual — testes e publicação do serviço de IA

on:
  push:
    branches: [main]
    paths: ['servidor/**', 'assistente/motor.js', 'dados/catalogo.json', 'testes/**', '.github/workflows/assistente.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test testes/*.test.mjs

  publicar-worker:
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Verificar configuração
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Segredos CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes — Worker não publicado. Veja docs/RAFAEL-VIRTUAL.md."
            echo "pronto=nao" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=sim" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar Worker
        if: steps.cfg.outputs.pronto == 'sim'
        working-directory: servidor
        run: npx --yes wrangler@4 deploy
      - name: Enviar chave da IA para o Worker (segredo)
        if: steps.cfg.outputs.pronto == 'sim' && env.ANTHROPIC_API_KEY != ''
        working-directory: servidor
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4 secret put ANTHROPIC_API_KEY
